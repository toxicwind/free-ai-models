name: Update Free AI Models List  on:   schedule:     - cron: '0 0 * * *'  # Runs every day at midnight UTC   workflow_dispatch:  # Allows manual trigger  jobs:   update-models:     runs-on: ubuntu-latest     permissions:       contents: write  # Needed to push changes      steps:       - name: Checkout repository         uses: actions/checkout@v4         with:           token: ${{ secrets.GITHUB_TOKEN }}            fetch-depth: 0  # Fetch full history for proper commits        - name: Set up Node.js         uses: actions/setup-node@v4         with:           node-version: '20'            cache: 'npm'        - name: Install dependencies         run: npm ci        - name: Fetch and update models         run: node scripts/fetch-models.js        - name: Commit and push changes         run: |           git config --local user.email 'action@github.com'           git config --local user.name 'GitHub Action'           git add data/models.json           git add data/history/*.json           git add README.md           git add grok_build_config.toml           if git diff --cached --quiet; then             echo 'No changes to commit'           else             git commit -m 'chore: update free AI models list + grok-build config [skip ci]'             git push           fi